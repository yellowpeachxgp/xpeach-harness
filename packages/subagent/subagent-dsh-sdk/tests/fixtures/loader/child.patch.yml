# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-deepseek
  name: '@xpeach/xph-llm-deepseek-api-key'
  disabled: true

- id: system-prompt
  name: '@xpeach/xph-system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@xpeach/xph-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@xpeach/xph-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@xpeach/xph-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'

# Keep this recorded child composition stable; plugin management is covered separately.
- id: tool-plugin-manager
  disabled: true
