# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@xpeach/xph-system-prompt'

- id: fs
  name: '@xpeach/xph-fs-local'

- id: session-projections
  name: '@xpeach/xph-session-projection'

- id: working-directory
  name: '@xpeach/xph-working-directory'

- id: tools
  name: '@xpeach/xph-tools'

- id: tool-executor-native
  name: '@xpeach/xph-tool-executor-native'

- id: subprocess
  name: '@xpeach/xph-subprocess-local'

- id: bash
  name: '@xpeach/xph-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@xpeach/xph-shell-env'

- id: tasks
  name: '@xpeach/xph-jobs-local'

- id: tool-jobs
  name: '@xpeach/xph-tool-jobs'

- id: tool-pwsh
  name: '@xpeach/xph-tool-pwsh'
