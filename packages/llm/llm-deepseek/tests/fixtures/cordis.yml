- name: '@xpeach/xph-llm'
- name: '@xpeach/xph-session'
- name: '@xpeach/xph-session-projection'
- name: '@xpeach/xph-system-prompt'
- name: '@xpeach/xph-tools'
- name: '@xpeach/xph-tool-executor-native'
- name: '@xpeach/xph-agent'
- name: '@xpeach/xph-agent-loop'
  config:
    agents: []
- name: '@xpeach/xph-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@xpeach/xph-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@xpeach/xph-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
