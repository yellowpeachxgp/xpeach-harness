- insert:
    - id: experimental-subagent-oar-codex
      name: '@xpeach/xph-experimental-subagent-oar'
      config:
        runtime: codex
        providerName: oar-codex
        launchArgs:
          - -c
          - sandbox_mode="workspace-write"
    - id: experimental-subagent-oar-claude
      name: '@xpeach/xph-experimental-subagent-oar'
      config:
        runtime: claude
        providerName: oar-claude
        launchArgs:
          - --permission-mode
          - dontAsk
          - --permission-prompts
          - none
    - id: tool-subagent-oar
      name: '@xpeach/xph-experimental-tool-subagent-oar'
      config:
        providers:
          codex: oar-codex
          claude: oar-claude

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: oar-loader-fixture
      name: './fixture.ts'
