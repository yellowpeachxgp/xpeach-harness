# Keyless replay layer for the ordinary SDK snapshot composition.

- id: llm-deepseek
  name: '@xpeach/xph-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@xpeach/xph-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  config:
    enabled: false
