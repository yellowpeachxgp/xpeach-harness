# Keyless PTC mode combines the runtime/registry changes with the
# DeepSeek-to-replay swap in one profile patch.
- insert:
    - id: ptc-mode-change
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/ptc-mode-change.ts'

- id: llm-deepseek
  name: '@xpeach/xph-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@xpeach/xph-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@xpeach/xph-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@xpeach/xph-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@xpeach/xph-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@xpeach/xph-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@xpeach/xph-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: ptc-runtime
  config:
    executionMode: per-call
