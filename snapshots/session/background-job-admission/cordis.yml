# Bounded-task admission overlay: keep the ordinary ACP composition while
# configuring its task provider to allow one active task per exact owner. The
# scenario starts a real background Bash process, observes the second producer
# rejection, and cleans up the first task by its returned id.
- id: agent-default-model
  name: '@xpeach/xph-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@xpeach/xph-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@xpeach/xph-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@xpeach/xph-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: jobs
  name: '@xpeach/xph-jobs-local'
  config:
    maxConcurrentJobsPerOwner: 1
