# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@xpeach/xph-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@xpeach/xph-subprocess-local'

- id: bash-sandbox
  name: '@xpeach/xph-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@xpeach/xph-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@xpeach/xph-shell-env'

- id: agent-default-model
  name: '@xpeach/xph-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@xpeach/xph-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@xpeach/xph-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@xpeach/xph-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@xpeach/xph-goal'
  disabled: true

- id: goal-round-driver
  name: '@xpeach/xph-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@xpeach/xph-command-goal'
  disabled: true

- id: tool-goal
  name: '@xpeach/xph-tool-goal'
  disabled: true

- id: skill
  name: '@xpeach/xph-skill'
  disabled: true

- id: skill-filesystem
  name: '@xpeach/xph-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@xpeach/xph-tool-skill'
  disabled: true

- id: tool-bash
  name: '@xpeach/xph-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@xpeach/xph-tool-pwsh'
  disabled: false
