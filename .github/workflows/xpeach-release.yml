name: Release Desktop (XPeach)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            artifact: xpeach-macos
          - os: ubuntu-22.04
            target: linux-x64
            artifact: xpeach-linux
          - os: windows-2022
            target: win-x64
            artifact: xpeach-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_APP_ID: codes.xpeach.harness
      DSH_DESKTOP_UNSIGNED: '1'
      DSH_DESKTOP_UPDATE_CHANNEL: latest
      XPEACH_GITHUB_RELEASE: '1'
      XPEACH_GITHUB_OWNER: yellowpeachxgp
      XPEACH_GITHUB_REPO: xpeach-harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host libraries
        run: pnpm run build:lib:host
      - name: Provide Windows packaging env
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=codes.xpeach.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://xpeach.codes
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://xpeach.codes"]}
          EOF
      - name: Build desktop app
        run: pnpm run build:desktop
      - name: Package (macOS)
        if: matrix.target == 'mac-arm64'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --mac dmg zip --arm64 --publish never
      - name: Package (Windows)
        if: matrix.target == 'win-x64'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --win nsis --x64 --publish never
      - name: Package (Linux)
        if: matrix.target == 'linux-x64'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --linux AppImage --x64 --publish never
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find apps/desktop/.desktop-build -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
