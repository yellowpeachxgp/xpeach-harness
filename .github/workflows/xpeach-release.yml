name: Release Desktop (XPeach)

# Two ways to cut a release:
#   * push a v* tag     - that tag's number is published
#   * run this workflow - the counter in version.json is bumped automatically
#                         (optionally pass an exact version to override)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish (leave empty to bump automatically)
        required: false
        default: ''
      bump:
        description: Which part to bump when no version is given
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the release version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./version.json').version")
          BUILD=$(node -p "require('./version.json').build")
          REQUESTED="${{ github.event.inputs.version }}"
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
            echo "manual override: $VERSION"
          elif printf '%s' "${{ github.ref }}" | grep -q '^refs/tags/v'; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tag release: $VERSION"
          else
            VERSION=$(node scripts/version/bump.mjs --dry-run "$BUMP")
            echo "automatic bump: $CURRENT -> $VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::resolved version $VERSION is not a semantic version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$((BUILD + 1))" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            artifact: xpeach-macos
          - os: ubuntu-22.04
            target: linux-x64
            artifact: xpeach-linux
          - os: windows-2022
            target: win-x64
            artifact: xpeach-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_APP_ID: codes.xpeach.harness
      DSH_DESKTOP_UNSIGNED: '1'
      DSH_DESKTOP_UPDATE_CHANNEL: latest
      XPEACH_GITHUB_RELEASE: '1'
      XPEACH_GITHUB_OWNER: yellowpeachxgp
      XPEACH_GITHUB_REPO: xpeach-harness
      XPEACH_GITHUB_PUBLISH: never
    steps:
      - uses: actions/checkout@v4
      - name: Apply the release version
        run: node scripts/version/bump.mjs "${{ needs.version.outputs.version }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host libraries
        run: pnpm run build:lib:host
      - name: Build workspace (client artifacts)
        if: matrix.target == 'linux-x64'
        env:
          DSH_CLIENT_BUILD_PROFILE: official
          DSH_CLIENT_TITLE: XPeach Harness
        run: pnpm run build
      - name: Provide the packaging dotenv
        shell: bash
        run: |
          for name in .env.macos .env.linux .env.windows; do
            cat > "apps/desktop/${name}" <<'EOF'
          DSH_DESKTOP_APP_ID=codes.xpeach.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://xpeach.codes
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://xpeach.codes"]}
          EOF
          done
          ls -la apps/desktop/.env.*
      - name: Build desktop app
        run: pnpm run build:desktop
      - name: Package (macOS)
        if: matrix.target == 'mac-arm64'
        run: pnpm --filter @xpeach/xph-desktop run package:mac:arm64:unsigned
      - name: Package (Windows)
        if: matrix.target == 'win-x64'
        run: pnpm --filter @xpeach/xph-desktop run package:win:x64:unsigned
      - name: Package (Linux)
        if: matrix.target == 'linux-x64'
        run: pnpm --filter @xpeach/xph-desktop run package:linux:x64:unsigned
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find apps/desktop/.desktop-build apps/desktop/dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Publish whatever built: one failing target must not withhold the installers
    # that did succeed.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Commit the bumped counter
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./version.json').version")" = "${{ needs.version.outputs.version }}" ]; then
            echo "counter already at this version"
            exit 0
          fi
          node scripts/version/bump.mjs "${{ needs.version.outputs.version }}"
          git -c user.name=xpeach -c user.email=xpeach@local commit -am "release: v${{ needs.version.outputs.version }}"
          git push
      - name: Compose the changelog
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${{ needs.version.outputs.version }}$" | head -n 1 || true)
          {
            echo "## XPeach Harness ${{ needs.version.outputs.version }}"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since $PREVIOUS"
              echo
              git log --no-merges --pretty='- %s' "${PREVIOUS}..HEAD" | head -n 60
            else
              echo "First public release."
              echo
              git log --no-merges --pretty='- %s' -n 60 HEAD
            fi
          } > CHANGELOG.md
          head -n 12 CHANGELOG.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file CHANGELOG.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "XPeach Harness $TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if echo "$ASSETS" | grep -qx 'latest-mac.yml' && echo "$ASSETS" | grep -qx 'latest.yml'; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
            echo "promoted $TAG to latest (update metadata present)"
          else
            echo "::warning::$TAG has no latest-*.yml; leaving the previous latest release in place"
          fi
