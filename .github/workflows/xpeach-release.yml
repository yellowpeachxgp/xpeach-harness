name: Release Desktop (XPeach)

# Two ways to cut a release:
#   * push a v* tag     - that tag's number is published
#   * run this workflow - the counter in version.json is bumped automatically
#                         (optionally pass an exact version to override)
# alpha and beta build on push. main is released when the owner asks for it,
# either by an explicit dispatch or by pushing a v* tag.
on:
  push:
    branches: [alpha, beta]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish (leave empty to bump automatically)
        required: false
        default: ''
      bump:
        description: Which part to bump when no version is given
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/beta' ||
      (github.ref == 'refs/heads/alpha' && !contains(github.event.head_commit.message, '-beta') && !contains(github.event.head_commit.message, '-least'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the release version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./version.json').version")
          BUILD=$(node -p "require('./version.json').build")
          REQUESTED="${{ github.event.inputs.version }}"
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
            if [ "$VERSION" != "$CURRENT" ]; then
              BUILD=$((BUILD + 1))
            fi
            echo "manual override: $VERSION"
          elif printf '%s' "${{ github.ref }}" | grep -q '^refs/tags/v'; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tag release: $VERSION"
          else
            # The branch decides the prerelease label; the counter only moves the
            # numeric core. See docs/product/RELEASE-CONTRACT.md.
            BRANCH="${{ github.ref_name }}"
            LABEL=$(node -e "
              const label={alpha:'-alpha',beta:'-beta',main:'-least'}['$BRANCH']
              if(label===undefined){console.error('not a release branch: $BRANCH');process.exit(1)}
              console.log(label)
            ")
            if [[ "$CURRENT" == *"$LABEL" ]] \
              && ! git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null \
              && [ -z "$(git log -n 1 --fixed-strings --grep="release: v$CURRENT" --format='%H')" ]; then
              VERSION="$CURRENT"
              echo "branch release on $BRANCH (using pre-bumped version.json): $VERSION"
            else
              CORE=$(node -e "
                const v=require('./version.json').version.replace(/-.*\$/,'');
                const p=v.split('.').map(Number);
                if('$BUMP'==='major'){p[0]+=1;p[1]=0;p[2]=0}
                else if('$BUMP'==='minor'){p[1]+=1;p[2]=0}
                else{p[2]+=1}
                console.log(p.join('.'))
              ")
              VERSION="${CORE}${LABEL}"
              BUILD=$((BUILD + 1))
              echo "branch release on $BRANCH: $CURRENT -> $VERSION"
            fi
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::resolved version $VERSION is not a semantic version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
            prefix: macos
            artifact: xpeach-macos
          - os: ubuntu-22.04
            target: linux-x64
            prefix: linux
            artifact: xpeach-linux
          - os: windows-2022
            target: win-x64
            prefix: windows
            artifact: xpeach-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_APP_ID: codes.xpeach.harness
      DSH_DESKTOP_UNSIGNED: '1'
      DSH_DESKTOP_UPDATE_CHANNEL: latest
      XPEACH_GITHUB_RELEASE: '1'
      XPEACH_GITHUB_OWNER: yellowpeachxgp
      XPEACH_GITHUB_REPO: xpeach-harness
      XPEACH_GITHUB_PUBLISH: never
    steps:
      - uses: actions/checkout@v4
      - name: Apply the release version
        run: node scripts/version/bump.mjs "${{ needs.version.outputs.version }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host libraries
        run: pnpm run build:lib:host
      - name: Provide the packaging dotenv
        shell: bash
        run: |
          for name in .env.macos .env.linux .env.windows; do
            cat > "apps/desktop/${name}" <<'EOF'
          DSH_DESKTOP_APP_ID=codes.xpeach.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://xpeach.codes
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://xpeach.codes"]}
          EOF
          done
          ls -la apps/desktop/.env.*
      - name: Build desktop app
        run: pnpm run build:desktop
      - name: Package (macOS)
        if: matrix.target == 'mac-arm64'
        run: |
          pnpm --filter @xpeach/xph-desktop run package:mac:arm64:unsigned
          pnpm --filter @xpeach/xph-desktop run package:mac:pkg -- --output "${{ github.workspace }}/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/xpeach-harness-${{ needs.version.outputs.version }}-arm64-unsigned.pkg"
      - name: Package (Windows)
        if: matrix.target == 'win-x64'
        run: pnpm --filter @xpeach/xph-desktop run package:win:x64:unsigned
      - name: Package (Linux)
        if: matrix.target == 'linux-x64'
        run: pnpm --filter @xpeach/xph-desktop run package:linux:x64:unsigned
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # Only the artifact root and the macOS bundle directory hold installers;
          # every other directory is unpacked application content or an Electron
          # download, and those must never reach the release.
          for directory in apps/desktop/.desktop-build/targets/*/unsigned-artifacts \
                           apps/desktop/.desktop-build/targets/*/unsigned-artifacts/mac-arm64; do
            [ -d "$directory" ] || continue
            find "$directory" -maxdepth 1 -type f \
              \( -name '*.dmg' -o -name '*.pkg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \) \
              -exec cp {} out/ \;
          done
          PREFIX="${{ matrix.prefix }}"
          for file in out/*.dmg out/*.pkg out/*.zip out/*.exe out/*.AppImage; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            case "$base" in
              "${PREFIX}-"*) ;;
              *) mv "$file" "out/${PREFIX}-${base}" ;;
            esac
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Publish whatever built: one failing target must not withhold the installers
    # that did succeed.
    if: >-
      always() &&
      needs.version.result == 'success' &&
      needs.version.outputs.version != '' &&
      needs.build.result != 'skipped' &&
      (startsWith(github.ref, 'refs/tags/v')
        || github.event_name == 'workflow_dispatch'
        || github.ref == 'refs/heads/alpha'
        || github.ref == 'refs/heads/beta')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Commit the bumped counter
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./version.json').version")" = "${{ needs.version.outputs.version }}" ]; then
            echo "counter already at this version"
            exit 0
          fi
          BRANCH=$(git symbolic-ref --quiet --short HEAD || true)
          if [ -z "$BRANCH" ]; then
            echo "detached HEAD (tag release); skipping counter commit"
            exit 0
          fi
          node scripts/version/bump.mjs "${{ needs.version.outputs.version }}"
          git -c user.name=yellowpeachxgp -c user.email=yellowpeachxgp@users.noreply.github.com commit -am "release: v${{ needs.version.outputs.version }}"
          if ! git push; then
            git reset --hard HEAD~1
          fi
      - name: Compose the changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          # A shallow checkout may carry no tags at all, and the tag a full clone
          # would offer may point at a commit this clone never fetched.
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -n 1 || true)
          if [ -n "$PREVIOUS" ] && ! git rev-parse --verify --quiet "${PREVIOUS}^{commit}" > /dev/null; then
            echo "previous tag $PREVIOUS is not in this checkout; listing recent commits instead"
            PREVIOUS=""
          fi
          case "$VERSION" in
            *-alpha*)
              CHANNEL_LINE='> 通道：`alpha`（内测版）'
              ;;
            *-beta*)
              CHANNEL_LINE='> 通道：`beta`（测试版 · `beta` 与 `alpha` 通道可接收）'
              ;;
            *)
              CHANNEL_LINE='> 通道：`least`（正式版 · 全通道接收）'
              ;;
          esac
          {
            echo "## XPeach Harness v${VERSION}"
            echo
            echo "$CHANNEL_LINE"
            echo
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo
            fi
            if [ -n "$PREVIOUS" ]; then
              echo "### 提交记录（自 $PREVIOUS 以来）"
              echo
              # --max-count rather than head: under pipefail a SIGPIPE'd git log
              # exits 141 and fails the whole step.
              git log --no-merges --invert-grep --grep='^release: v' --pretty='- %s' --max-count=40 "${PREVIOUS}..HEAD"
            else
              echo "### 提交记录"
              echo
              git log --no-merges --invert-grep --grep='^release: v' --pretty='- %s' --max-count=40 HEAD
            fi
          } > CHANGELOG.md
          head -n 30 CHANGELOG.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version.outputs.version }}"
          PRERELEASE_ARGS=()
          IS_PRERELEASE=0
          case "$TAG" in
            *-alpha*|*-beta*)
              PRERELEASE_ARGS=(--prerelease)
              IS_PRERELEASE=1
              ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "XPeach Harness $TAG" "${PRERELEASE_ARGS[@]}" --notes-file CHANGELOG.md
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if [ "$IS_PRERELEASE" -eq 0 ] && echo "$ASSETS" | grep -qx 'latest-mac.yml' && echo "$ASSETS" | grep -qx 'latest.yml'; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
            echo "promoted $TAG to latest (update metadata present)"
          elif [ "$IS_PRERELEASE" -eq 1 ]; then
            echo "prerelease $TAG published; leaving the latest stable release in place"
          else
            echo "::warning::$TAG has no latest-*.yml; leaving the previous latest release in place"
          fi
